<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Kambeton - Zaman Etüdü</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1C1D1F" />
<link rel="stylesheet" href="style.css" />
<style>
  .worker-tile, .tile { position: relative; user-select: none; }
  .tile-actions, .worker-tile-actions {
    position: absolute; top: 6px; right: 6px; display: flex; gap: 5px; z-index: 5;
  }
  .item-action-btn, .worker-action-btn {
    background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px; color: #e0e0e0;
  }
  .item-action-btn:hover, .worker-action-btn:hover { background: rgba(255, 255, 255, 0.2); }
  .btn-del:hover { background: #e74c3c !important; color: #fff !important; }
  .add-item-tile, .add-worker-tile {
    background: rgba(255, 255, 255, 0.05); border: 2px dashed rgba(255, 255, 255, 0.2);
    color: #aaa; border-radius: 8px; padding: 16px; cursor: pointer; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .active-jobs-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
  .selector-row { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .selector-btn {
    flex: 1; min-width: 70px; padding: 12px 6px; background: #2b2d30; border: 1px solid #444;
    color: #fff; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center;
  }
  .selector-btn.active { background: #ff6a13; border-color: #ff6a13; color: #111; }
  .count-custom-input { width: 65px; text-align: center; background: #2b2d30; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 15px; }
  .history-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 14px; background: #232528; border-radius: 8px; margin-bottom: 8px;
  }
  .history-actions { display: flex; gap: 6px; align-items: center; }
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .modal-overlay[hidden], [hidden] { display: none !important; }
  .modal-card {
    background: #1c1d1f; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 450px; padding: 20px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div id="app" class="app">
  <header class="header">
    <div class="header-top">
      <div class="brand"><span class="dot"></span>Kambeton &middot; Zaman Etüdü</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="worker-bar" id="workerBar" hidden>
      <div class="worker-info">
        <span id="workerName" style="font-weight:bold; color:var(--orange);"></span>
        <span class="muted">&middot; Sicil <span id="workerId"></span></span>
      </div>
      <button class="btn-ghost" id="logoutBtn">Çıkış Yap</button>
    </div>
  </header>
  <div class="hazard-strip"></div>
  <div id="errorBar" class="error-bar" hidden></div>

  <main class="main">
    <!-- 1. GÖZLEMCİ SEÇİMİ -->
    <section id="screenWorkerSelect" class="screen">
      <div class="section-label">Etüt Sorumlusu / Gözlemci Seç</div>
      <div class="tile-grid" id="workerGrid"></div>

      <div id="addWorkerForm" class="panel" hidden>
        <div class="panel-head">
          <span>Yeni Sorumlu Ekle</span>
          <button class="btn-icon" id="closeAddWorker">&times;</button>
        </div>
        <div class="form-row">
          <input id="newWorkerId" placeholder="Sicil No" />
          <input id="newWorkerName" placeholder="Ad Soyad" />
          <button class="btn-primary" id="submitAddWorker">Ekle</button>
        </div>
      </div>
    </section>

    <!-- 2. ANA PANEL -->
    <section id="screenDashboard" class="screen" hidden>
      <div id="activeJobsList" class="active-jobs-container"></div>
      <button class="btn-start" id="startJobBtn">YENİ İŞLEM BAŞLAT</button>

      <div id="historyBlock" hidden>
        <div class="section-label">Bu Sorumlunun Tamamlanan İşlemleri</div>
        <div id="historyList" class="list-col"></div>
      </div>

      <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
        <button class="btn-ghost" id="exportBtn">SADECE BU SORUMLUNUN ETÜDÜNÜ İNDİR (EXCEL)</button>
        <button class="btn-ghost" id="clearMyDataBtn" style="color:#e74c3c; border-color:#e74c3c;">Bu Sorumlunun Kayıtlarını Temizle</button>
      </div>
    </section>

    <!-- 3. İŞLEM BAŞLAT -->
    <section id="screenStart" class="screen" hidden>
      <button class="btn-back" id="startBack">&larr; Vazgeç</button>

      <div class="section-label">1. Faaliyet Türü</div>
      <div class="selector-row" id="activitySelector">
        <button type="button" class="selector-btn active" data-val="İŞLEM">İŞLEM</button>
        <button type="button" class="selector-btn" data-val="TAŞIMA">TAŞIMA</button>
        <button type="button" class="selector-btn" data-val="BEKLEME">BEKLEME</button>
        <button type="button" class="selector-btn" data-val="HAZIRLIK">HAZIRLIK</button>
      </div>

      <div class="section-label">2. İşlem Adı</div>
      <div class="tile-grid" id="jobTypeGrid"></div>

      <div class="section-label">3. İstasyon / Hat</div>
      <div class="tile-grid" id="stationGrid"></div>

      <div class="section-label">4. Kişi Sayısı</div>
      <div class="selector-row" id="workerCountSelector">
        <button type="button" class="selector-btn" data-count="1">1</button>
        <button type="button" class="selector-btn active" data-count="2">2</button>
        <button type="button" class="selector-btn" data-count="3">3</button>
        <button type="button" class="selector-btn" data-count="4">4</button>
        <button type="button" class="selector-btn" data-count="5">5</button>
        <input type="number" id="customWorkerCount" class="count-custom-input" min="1" max="50" placeholder="Diğer" />
      </div>

      <button class="btn-start btn-block" id="confirmStartBtn" disabled>İŞLEMİ BAŞLAT</button>
    </section>

    <!-- 4. İŞLEM BİTİR -->
    <section id="screenEnd" class="screen" hidden>
      <button class="btn-back" id="endBack">&larr; Vazgeç</button>
      <div class="panel">
        <div class="active-title" id="endJobType"></div>
        <div class="active-meta"><span id="endMeta"></span></div>
        <div class="timer" id="endTimer">00:00:00</div>
      </div>
      <div class="section-label">İş Durması / Gecikme Nedeni</div>
      <textarea id="endStopReason" placeholder="Varsa gecikme nedeni..."></textarea>
      <button class="btn-danger btn-block" id="confirmEndBtn">İŞLEMİ BİTİR</button>
    </section>
  </main>
</div>

<!-- DÜZENLEME MODALI -->
<div id="editLogModal" class="modal-overlay" hidden>
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span id="modalJobTitle" style="font-weight:bold; color:var(--orange);">İşlemi Düzenle</span>
      <button class="btn-icon" id="closeEditModal" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <div class="section-label">Kişi Sayısı</div>
    <input type="number" id="modalWorkerCount" class="count-custom-input" style="width:100%; height:38px; margin-bottom:12px; text-align:left; padding-left:10px;" min="1" max="50" />
    <div class="section-label">Duruş / Gecikme Nedeni</div>
    <textarea id="modalStopReason" style="margin-bottom:15px; width:100%;"></textarea>
    <div style="display:flex; gap:10px;">
      <button class="btn-ghost" id="cancelEditModal" style="flex:1;">İptal</button>
      <button class="btn-primary" id="saveEditModal" style="flex:1;">Kaydet</button>
    </div>
  </div>
</div>

<script>
const LS = {
  workers: "ist_workers_v3",
  jobTypes: "ist_jobtypes_v3",
  stations: "ist_stations_v3",
  logs: "ist_logs_v3"
};

function loadLS(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch(e) { return fb; } }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

let state = {
  worker: null,
  workers: [],
  jobTypes: [],
  stations: [],
  logs: [],
  activeLogs: [],
  endingLog: null,
  editingLogId: null,
  selJobType: null,
  selStation: null,
  selActivity: "İŞLEM",
  workerCount: 2
};

const el = (id) => document.getElementById(id);
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"}) : "--:--";
const fmtDuration = (ms) => {
  const s = Math.max(0, Math.floor(ms/1000));
  return [Math.floor(s/3600), Math.floor((s%3600)/60), s%60].map(v => String(v).padStart(2,"0")).join(":");
};

function showScreen(name) {
  ["screenWorkerSelect", "screenDashboard", "screenStart", "screenEnd"].forEach(id => {
    const d = el(id); if (d) d.hidden = (id !== name);
  });
}

function renderWorkerGrid() {
  const grid = el("workerGrid");
  grid.innerHTML = "";
  state.workers.forEach(w => {
    const d = document.createElement("div");
    d.className = "worker-tile";
    d.innerHTML = `<div class="worker-avatar">${w.name.slice(0,2).toUpperCase()}</div><div class="worker-tile-name">${w.name}</div><div class="worker-tile-id">Sicil ${w.id}</div>`;
    d.onclick = () => selectWorker(w);
    grid.appendChild(d);
  });
  const addBtn = document.createElement("button");
  addBtn.className = "add-worker-tile";
  addBtn.innerHTML = `+ Sorumlu Ekle`;
  addBtn.onclick = () => el("addWorkerForm").hidden = false;
  grid.appendChild(addBtn);
}

function selectWorker(w) {
  state.worker = w;
  el("workerBar").hidden = false;
  el("workerName").textContent = w.name;
  el("workerId").textContent = w.id;
  showScreen("screenDashboard");
  refreshDashboard();
}

el("logoutBtn").onclick = () => {
  state.worker = null;
  el("workerBar").hidden = true;
  showScreen("screenWorkerSelect");
};

function refreshDashboard() {
  if (!state.worker) return;
  const wid = state.worker.id;
  state.activeLogs = state.logs.filter(l => l.worker_id === wid && l.status === "active");

  const container = el("activeJobsList");
  container.innerHTML = "";
  state.activeLogs.forEach(log => {
    const c = document.createElement("div");
    c.className = "active-card";
    c.innerHTML = `
      <div class="active-tag">${log.activity} &middot; ${log.worker_count} Kişi</div>
      <div class="active-title">${log.job_type}</div>
      <div class="timer" id="timer-${log.id}">00:00:00</div>
      <button class="btn-danger btn-block" style="margin-top:10px;">İŞLEMİ BİTİR</button>
    `;
    c.querySelector("button").onclick = () => {
      state.endingLog = log;
      el("endJobType").textContent = log.job_type;
      el("endMeta").textContent = `${log.station} \u00b7 ${log.worker_count} Kişi`;
      el("endStopReason").value = "";
      showScreen("screenEnd");
    };
    container.appendChild(c);
  });

  // TAMAMLANAN İŞLER LİSTESİ (✏️ DÜZENLE VE 🗑️ SİL BUTONLARIYLA)
  const myHistory = state.logs.filter(l => l.worker_id === wid && l.status === "done").reverse();
  const histBlock = el("historyBlock");
  const histList = el("historyList");
  if (myHistory.length > 0) {
    histBlock.hidden = false;
    histList.innerHTML = "";
    myHistory.forEach(l => {
      const dur = Math.round((new Date(l.end_time) - new Date(l.start_time)) / 60000);
      const row = document.createElement("div");
      row.className = "history-row";
      row.innerHTML = `
        <div>
          <div style="font-weight:bold; color:#fff;">[${l.activity}] ${l.job_type}</div>
          <div style="font-size:12px; color:#aaa;">${l.station} &middot; ${l.worker_count} Kişi &middot; ${dur} dk ${l.stop_reason ? `<span style="color:#f39c12;">&middot; Duruş: ${l.stop_reason}</span>` : ""}</div>
        </div>
        <div class="history-actions">
          <span style="font-size:12px; color:#2ecc71; margin-right:4px;">Tamamlandı</span>
          <button class="item-action-btn btn-edit" title="Düzenle">✏️</button>
          <button class="item-action-btn btn-del" title="Sil">🗑️</button>
        </div>
      `;

      // ✏️ Düzenle Butonu
      row.querySelector(".btn-edit").onclick = () => {
        state.editingLogId = l.id;
        el("modalJobTitle").textContent = `[${l.activity}] ${l.job_type}`;
        el("modalWorkerCount").value = l.worker_count;
        el("modalStopReason").value = l.stop_reason || "";
        el("editLogModal").hidden = false;
      };

      // 🗑️ Sil Butonu
      row.querySelector(".btn-del").onclick = () => {
        if (confirm(`"${l.job_type}" işlemini silmek istediğinize emin misiniz?`)) {
          state.logs = state.logs.filter(x => x.id !== l.id);
          saveLS(LS.logs, state.logs);
          refreshDashboard();
        }
      };

      histList.appendChild(row);
    });
  } else {
    histBlock.hidden = true;
  }
}

// Modal Kapatma ve Kaydetme
function closeEditModal() {
  state.editingLogId = null;
  el("editLogModal").hidden = true;
}
el("closeEditModal").onclick = closeEditModal;
el("cancelEditModal").onclick = closeEditModal;

el("saveEditModal").onclick = () => {
  if (!state.editingLogId) return;
  const target = state.logs.find(l => l.id === state.editingLogId);
  if (target) {
    target.worker_count = parseInt(el("modalWorkerCount").value) || 1;
    target.stop_reason = el("modalStopReason").value.trim();
    saveLS(LS.logs, state.logs);
  }
  closeEditModal();
  refreshDashboard();
};

// SADECE GİRİŞ YAPAN KİŞİNİN EXCEL ÇIKTISI
el("exportBtn").onclick = () => {
  if (!state.worker) return;
  const wid = state.worker.id;
  
  const targetLogs = state.logs.filter(l => l.worker_id === wid && l.status === "done");
  if (targetLogs.length === 0) {
    alert(`${state.worker.name} adına kayıt bulunamadı.`);
    return;
  }

  const baseTime = new Date(targetLogs[0].start_time).getTime();

  const wsData = [
    ["KAMBETON A.Ş. - ZAMAN ETÜDÜ FORMU"],
    ["Gözlemci:", state.worker.name, "", "Tarih:", new Date().toLocaleDateString("tr-TR")],
    [],
    ["İŞLEM NO", "İŞLEM ADI", "FAALİYET", "BAŞLANGIÇ SAATİ", "BAŞLAMA", "BİTİŞ SAATİ", "BİTİŞ", "SÜRE (dk)", "KİŞİ", "ADAM SAAT", "DURUŞ NEDENİ"]
  ];

  let sumIslem = 0, sumTasima = 0, sumBekleme = 0, sumHazirlik = 0, sumAdamSaat = 0;

  targetLogs.forEach((l, idx) => {
    const sMs = new Date(l.start_time).getTime();
    const eMs = new Date(l.end_time).getTime();
    const baslama = Math.max(0, Math.round((sMs - baseTime) / 60000));
    const bitis = Math.max(0, Math.round((eMs - baseTime) / 60000));
    const sure = Math.max(0, Math.round((eMs - sMs) / 60000));
    const as = Number(((sure * l.worker_count) / 60).toFixed(2));

    if (l.activity === "İŞLEM") sumIslem += sure;
    else if (l.activity === "TAŞIMA") sumTasima += sure;
    else if (l.activity === "BEKLEME") sumBekleme += sure;
    else if (l.activity === "HAZIRLIK") sumHazirlik += sure;
    sumAdamSaat += as;

    wsData.push([
      idx + 1, l.job_type, l.activity, fmtTime(l.start_time), baslama, fmtTime(l.end_time), bitis, sure, l.worker_count, as, l.stop_reason || "-"
    ]);
  });

  wsData.push([]);
  wsData.push(["FAALİYET", "SÜRE (DK)", "", "ÖZET", "DEĞER"]);
  wsData.push(["İŞLEM", sumIslem, "", "TOPLAM İŞLEM", sumIslem]);
  wsData.push(["TAŞIMA", sumTasima, "", "TOPLAM TAŞIMA", sumTasima]);
  wsData.push(["BEKLEME", sumBekleme, "", "TOPLAM BEKLEME", sumBekleme]);
  wsData.push(["HAZIRLIK", sumHazirlik, "", "TOPLAM HAZIRLIK", sumHazirlik]);
  wsData.push(["", "", "", "TOPLAM ADAM SAAT", Number(sumAdamSaat.toFixed(2))]);

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Etut");
  
  XLSX.writeFile(wb, `Kambeton_${state.worker.name}_Etudu.xlsx`);
};

el("clearMyDataBtn").onclick = () => {
  if (confirm(`${state.worker.name} adına ait tüm kayıtlar silinsin mi?`)) {
    state.logs = state.logs.filter(l => l.worker_id !== state.worker.id);
    saveLS(LS.logs, state.logs);
    refreshDashboard();
  }
};

// Sorumlu Ekleme
el("submitAddWorker").onclick = () => {
  const id = el("newWorkerId").value.trim(), name = el("newWorkerName").value.trim();
  if (!id || !name) return;
  state.workers.push({ id, name });
  saveLS(LS.workers, state.workers);
  el("newWorkerId").value = ""; el("newWorkerName").value = "";
  el("addWorkerForm").hidden = true;
  renderWorkerGrid();
};
el("closeAddWorker").onclick = () => el("addWorkerForm").hidden = true;

// İşlem Başlatma Akışı
el("startJobBtn").onclick = () => {
  state.selJobType = null; state.selStation = null;
  renderStartFlow();
  showScreen("screenStart");
};
el("startBack").onclick = () => showScreen("screenDashboard");
el("endBack").onclick = () => showScreen("screenDashboard");

function renderStartFlow() {
  const jg = el("jobTypeGrid"); jg.innerHTML = "";
  state.jobTypes.forEach(jt => {
    const t = document.createElement("div");
    t.className = "tile" + (state.selJobType === jt.name ? " active-orange" : "");
    t.innerHTML = `<span>${jt.name}</span>`;
    t.onclick = () => { state.selJobType = jt.name; renderStartFlow(); };
    jg.appendChild(t);
  });
  const addJt = document.createElement("div");
  addJt.className = "add-item-tile"; addJt.textContent = "+ İşlem Ekle";
  addJt.onclick = () => {
    const n = prompt("Yeni İşlem:");
    if (n) { state.jobTypes.push({id: Date.now(), name: n.trim()}); saveLS(LS.jobTypes, state.jobTypes); renderStartFlow(); }
  };
  jg.appendChild(addJt);

  const sg = el("stationGrid"); sg.innerHTML = "";
  state.stations.forEach(st => {
    const t = document.createElement("div");
    t.className = "tile" + (state.selStation === st.name ? " active-yellow" : "");
    t.innerHTML = `<span>${st.name}</span>`;
    t.onclick = () => { state.selStation = st.name; renderStartFlow(); };
    sg.appendChild(t);
  });
  const addSt = document.createElement("div");
  addSt.className = "add-item-tile"; addSt.textContent = "+ Hat/İstasyon Ekle";
  addSt.onclick = () => {
    const n = prompt("Yeni İstasyon:");
    if (n) { state.stations.push({id: Date.now(), name: n.trim()}); saveLS(LS.stations, state.stations); renderStartFlow(); }
  };
  sg.appendChild(addSt);

  el("confirmStartBtn").disabled = !(state.selJobType && state.selStation);
}

document.querySelectorAll("#activitySelector .selector-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#activitySelector .selector-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    state.selActivity = b.getAttribute("data-val");
  };
});

document.querySelectorAll("#workerCountSelector .selector-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#workerCountSelector .selector-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    state.workerCount = parseInt(b.getAttribute("data-count"));
  };
});

el("confirmStartBtn").onclick = () => {
  state.logs.push({
    id: "log-" + Date.now(),
    worker_id: state.worker.id,
    job_type: state.selJobType,
    activity: state.selActivity,
    station: state.selStation,
    worker_count: state.workerCount,
    start_time: new Date().toISOString(),
    end_time: null,
    status: "active"
  });
  saveLS(LS.logs, state.logs);
  showScreen("screenDashboard");
  refreshDashboard();
};

el("confirmEndBtn").onclick = () => {
  const t = state.logs.find(l => l.id === state.endingLog.id);
  if (t) {
    t.end_time = new Date().toISOString();
    t.stop_reason = el("endStopReason").value.trim();
    t.status = "done";
    saveLS(LS.logs, state.logs);
  }
  showScreen("screenDashboard");
  refreshDashboard();
};

setInterval(() => {
  const now = new Date();
  el("clock").textContent = now.toLocaleTimeString("tr-TR");
  if (!el("screenDashboard").hidden) {
    state.activeLogs.forEach(l => {
      const td = document.getElementById("timer-" + l.id);
      if (td) td.textContent = fmtDuration(now - new Date(l.start_time));
    });
  }
}, 1000);

function init() {
  state.workers = loadLS(LS.workers, []);
  state.jobTypes = loadLS(LS.jobTypes, []);
  state.stations = loadLS(LS.stations, []);
  state.logs = loadLS(LS.logs, []);
  renderWorkerGrid();
  showScreen("screenWorkerSelect");
}
init();
</script>
</body>
</html>
