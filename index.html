<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Kambeton - Zaman Etüdü</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1C1D1F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kambeton" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
<style>
  .worker-tile, .tile {
    position: relative;
    user-select: none;
  }
  .tile-actions, .worker-tile-actions {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 5px;
    z-index: 5;
  }
  .item-action-btn, .worker-action-btn {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
    font-size: 12px;
    color: #e0e0e0;
    transition: all 0.2s;
  }
  .item-action-btn:hover, .worker-action-btn:hover {
    background: rgba(255, 255, 255, 0.3);
  }
  .btn-del:hover {
    background: #e74c3c !important;
    border-color: #e74c3c !important;
    color: #fff !important;
  }
  .add-item-tile {
    background: rgba(255, 255, 255, 0.05);
    border: 2px dashed rgba(255, 255, 255, 0.2);
    color: #aaa;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.2s;
  }
  .add-item-tile:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border-color: #fff;
  }
  .active-jobs-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 20px;
  }
  .active-card {
    margin-bottom: 0;
  }
  .selector-row {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .selector-btn {
    flex: 1;
    min-width: 70px;
    padding: 12px 6px;
    background: #2b2d30;
    border: 1px solid #444;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    text-align: center;
  }
  .selector-btn.active {
    background: #ff6a13;
    border-color: #ff6a13;
    color: #111;
  }
  .count-custom-input {
    width: 65px;
    text-align: center;
    background: #2b2d30;
    border: 1px solid #444;
    color: #fff;
    border-radius: 8px;
    font-size: 15px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div id="app" class="app">

  <header class="header">
    <div class="header-top">
      <div class="brand"><span class="dot"></span>Kambeton &middot; Zaman Etüdü</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="worker-bar" id="workerBar" hidden>
      <div class="worker-info">
        <span id="workerName"></span>
        <span class="muted">&middot; Sicil <span id="workerId"></span></span>
        <span class="muted">&middot; Vardiya <span id="shiftLabel"></span></span>
      </div>
      <button class="btn-ghost" id="logoutBtn">Çıkış Yap</button>
    </div>
  </header>
  <div class="hazard-strip"></div>

  <div id="errorBar" class="error-bar" hidden></div>

  <main class="main">

    <!-- İŞÇİ SEÇİMİ -->
    <section id="screenWorkerSelect" class="screen">
      <div class="section-label">Etüt Sorumlusu / Gözlemci Seç</div>
      <div class="tile-grid" id="workerGrid"></div>

      <div id="addWorkerForm" class="panel" hidden>
        <div class="panel-head">
          <span>Yeni Sorumlu Ekle</span>
          <button class="btn-icon" id="closeAddWorker">&times;</button>
        </div>
        <div class="form-row">
          <input id="newWorkerId" placeholder="Sicil No" />
          <input id="newWorkerName" placeholder="Ad Soyad" />
          <button class="btn-primary" id="submitAddWorker">Ekle</button>
        </div>
      </div>
    </section>

    <!-- ANA PANEL -->
    <section id="screenDashboard" class="screen" hidden>
      <div id="activeJobsList" class="active-jobs-container"></div>

      <button class="btn-start" id="startJobBtn">YENİ İŞLEM BAŞLAT</button>

      <div id="historyBlock" hidden>
        <div class="section-label">Son Tamamlanan İşlemler</div>
        <div id="historyList" class="list-col"></div>
      </div>

      <div class="export-block">
        <button class="btn-ghost" id="exportBtn">Zaman Etüdü Tablosunu Excel'e Aktar</button>
      </div>
    </section>

    <!-- İŞ BAŞLAT AKIŞI -->
    <section id="screenStart" class="screen" hidden>
      <button class="btn-back" id="startBack">&larr; Vazgeç</button>

      <!-- 1. FAALİYET TÜRÜ -->
      <div class="section-label">1. Faaliyet Türü</div>
      <div class="selector-row" id="activitySelector">
        <button type="button" class="selector-btn active" data-val="İŞLEM">İŞLEM</button>
        <button type="button" class="selector-btn" data-val="TAŞIMA">TAŞIMA</button>
        <button type="button" class="selector-btn" data-val="BEKLEME">BEKLEME</button>
        <button type="button" class="selector-btn" data-val="HAZIRLIK">HAZIRLIK</button>
      </div>

      <!-- 2. İŞLEM ADI -->
      <div class="section-label">2. İşlem Adı</div>
      <div class="tile-grid" id="jobTypeGrid"></div>

      <!-- 3. İSTASYON -->
      <div class="section-label">3. İstasyon / Hat</div>
      <div class="tile-grid" id="stationGrid"></div>

      <!-- 4. KİŞİ SAYISI -->
      <div class="section-label">4. Kişi Sayısı</div>
      <div class="selector-row" id="workerCountSelector">
        <button type="button" class="selector-btn" data-count="1">1</button>
        <button type="button" class="selector-btn active" data-count="2">2</button>
        <button type="button" class="selector-btn" data-count="3">3</button>
        <button type="button" class="selector-btn" data-count="4">4</button>
        <button type="button" class="selector-btn" data-count="5">5</button>
        <input type="number" id="customWorkerCount" class="count-custom-input" min="1" max="50" placeholder="Diğer" />
      </div>

      <div class="section-label">5. Not (İsteğe bağlı)</div>
      <textarea id="startNote" placeholder="İsteğe bağlı ek açıklama..."></textarea>

      <button class="btn-start btn-block" id="confirmStartBtn" disabled>İŞLEMİ BAŞLAT</button>
    </section>

    <!-- İŞ BİTİR AKIŞI -->
    <section id="screenEnd" class="screen" hidden>
      <button class="btn-back" id="endBack">&larr; Vazgeç</button>

      <div class="panel">
        <div class="active-title" id="endJobType"></div>
        <div class="active-meta"><span id="endMeta"></span></div>
        <div class="timer" id="endTimer">00:00:00</div>
      </div>

      <div class="section-label">İş Durması / Gecikme Oldu mu? (Nedeni)</div>
      <textarea id="endStopReason" placeholder="Örnek: Vinç arızası / Malzeme bekleme (Yoksa boş bırakın)"></textarea>

      <button class="btn-danger btn-block" id="confirmEndBtn">İŞLEMİ BİTİR</button>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
