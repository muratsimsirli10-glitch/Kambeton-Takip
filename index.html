<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Kambeton - Zaman Etüdü</title>

<meta name="theme-color" content="#1C1D1F" />
<style>
  :root {
    --bg: #151618;
    --card: #202225;
    --card-border: #32353b;
    --orange: #ff6a13;
    --orange-hover: #e65a07;
    --danger: #e74c3c;
    --success: #2ecc71;
    --text: #f5f6f8;
    --text-muted: #9ba1a6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

  .header {
    background: #1c1d1f; padding: 14px 20px; border-bottom: 1px solid var(--card-border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { font-size: 16px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
  .clock { font-family: monospace; font-size: 16px; color: #ffb84d; }

  .worker-bar {
    background: #272a2e; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--orange);
  }
  .btn-ghost {
    background: transparent; border: 1px solid #555; color: #ccc; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .btn-ghost:hover { background: #333; color: #fff; }

  .main { max-width: 650px; margin: 0 auto; padding: 20px 16px; }

  .section-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; margin: 18px 0 8px 0; }

  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile, .worker-tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 14px 10px;
    text-align: center; cursor: pointer; transition: 0.15s; position: relative;
  }
  .tile:hover, .worker-tile:hover { border-color: var(--orange); }
  .tile.active-orange { background: rgba(255, 106, 19, 0.15); border-color: var(--orange); color: #fff; font-weight: bold; }
  .tile.active-yellow { background: rgba(241, 196, 15, 0.15); border-color: #f1c40f; color: #fff; font-weight: bold; }
  
  .worker-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: #3a3d42; margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: var(--orange);
  }
  .worker-name { font-weight: bold; font-size: 14px; }
  .worker-id { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .add-btn-tile {
    background: rgba(255,255,255,0.03); border: 2px dashed #444; border-radius: 8px;
    padding: 14px 10px; display: flex; align-items: center; justify-content: center;
    color: #888; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .add-btn-tile:hover { border-color: #aaa; color: #fff; }

  .btn-start {
    width: 100%; padding: 16px; background: var(--orange); border: none; border-radius: 8px;
    font-size: 16px; font-weight: bold; color: #111; cursor: pointer; margin-top: 10px;
  }
  .btn-start:hover { background: var(--orange-hover); }
  .btn-start:disabled { background: #444; color: #777; cursor: not-allowed; }

  .btn-danger {
    width: 100%; padding: 14px; background: var(--danger); border: none; border-radius: 8px;
    font-size: 15px; font-weight: bold; color: #fff; cursor: pointer;
  }

  .active-card {
    background: #25282c; border-left: 4px solid var(--orange); border-radius: 8px; padding: 16px; margin-bottom: 15px;
  }
  .active-tag { font-size: 12px; color: var(--orange); font-weight: bold; margin-bottom: 4px; }
  .active-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .timer { font-family: monospace; font-size: 26px; font-weight: bold; color: #ffb84d; margin-bottom: 12px; }

  .history-row {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .history-title { font-weight: 600; font-size: 14px; color: #fff; }
  .history-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .history-right { display: flex; align-items: center; gap: 8px; }
  .btn-action {
    background: #33363b; border: 1px solid #444; border-radius: 6px; padding: 6px 8px;
    cursor: pointer; font-size: 13px; color: #eee; transition: 0.15s;
  }
  .btn-action:hover { background: #44484f; }
  .btn-action.del:hover { background: var(--danger); border-color: var(--danger); }

  .selector-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .selector-btn {
    flex: 1; min-width: 65px; padding: 12px 6px; background: #282a2d; border: 1px solid #444;
    color: #fff; font-weight: bold; font-size: 13px; border-radius: 6px; cursor: pointer; text-align: center;
  }
  .selector-btn.active { background: var(--orange); border-color: var(--orange); color: #111; }
  .custom-input {
    width: 60px; text-align: center; background: #282a2d; border: 1px solid #444; color: #fff;
    border-radius: 6px; font-size: 14px;
  }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .modal-overlay[hidden], [hidden] { display: none !important; }
  .modal-card {
    background: #1f2124; border: 1px solid #3d4147; border-radius: 10px; width: 100%; max-width: 420px; padding: 20px;
  }
  textarea {
    width: 100%; background: #282a2d; border: 1px solid #444; border-radius: 6px;
    padding: 10px; color: #fff; resize: vertical; min-height: 70px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="header">
  <div class="brand"><span class="dot"></span>KAMBETON &middot; Zaman Etüdü</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="worker-bar" id="workerBar" hidden>
  <div>
    <span id="displayWorkerName" style="font-weight:bold; color:var(--orange);"></span>
    <span style="font-size:12px; color:var(--text-muted); margin-left:6px;">(Sicil: <span id="displayWorkerId"></span>)</span>
  </div>
  <button class="btn-ghost" id="logoutBtn">Çıkış Yap</button>
</div>

<main class="main">

  <!-- 1. GÖZLEMCİ SEÇİMİ -->
  <section id="screenWorkers">
    <div class="section-label">Etüt Sorumlusu / Gözlemci Seç</div>
    <div class="tile-grid" id="workerGrid"></div>

    <div id="addWorkerCard" style="background:#202225; padding:15px; border-radius:8px; border:1px solid #333; margin-top:15px;" hidden>
      <div style="font-size:13px; font-weight:bold; margin-bottom:10px;">Yeni Sorumlu Kaydet</div>
      <div style="display:flex; gap:8px;">
        <input id="newWId" placeholder="Sicil No" style="flex:1; padding:10px; background:#282a2d; border:1px solid #444; border-radius:6px; color:#fff;" />
        <input id="newWName" placeholder="Ad Soyad" style="flex:2; padding:10px; background:#282a2d; border:1px solid #444; border-radius:6px; color:#fff;" />
        <button id="btnSaveWorker" style="background:var(--orange); border:none; padding:10px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">Ekle</button>
      </div>
    </div>
  </section>

  <!-- 2. ANA PANEL -->
  <section id="screenDashboard" hidden>
    <div id="activeBox"></div>

    <button class="btn-start" id="btnOpenStartScreen">+ YENİ İŞLEM BAŞLAT</button>

    <div id="historyContainer" style="margin-top:25px;" hidden>
      <div class="section-label">Bu Gözlemcinin Tamamladığı İşlemler</div>
      <div id="historyList"></div>
    </div>

    <div style="margin-top:30px; display:flex; flex-direction:column; gap:10px;">
      <button class="btn-ghost" id="btnExportExcel" style="padding:14px; border-color:var(--orange); color:#fff; font-weight:bold;">
        📥 SADECE BU ETÜDÜ EXCEL'E AKTAR
      </button>
      <button class="btn-ghost" id="btnClearMyEtud" style="padding:10px; border-color:var(--danger); color:var(--danger); font-size:12px;">
        🗑️ Bu Gözlemcinin Kayıtlarını Sıfırla (Yeni Etüde Başla)
      </button>
    </div>
  </section>

  <!-- 3. İŞLEM BAŞLATMA FORMU -->
  <section id="screenStart" hidden>
    <button class="btn-ghost" id="btnCancelStart" style="margin-bottom:15px;">&larr; Vazgeç</button>

    <div class="section-label">1. Faaliyet Türü</div>
    <div class="selector-row" id="activitySelector">
      <button class="selector-btn active" data-v="İŞLEM">İŞLEM</button>
      <button class="selector-btn" data-v="TAŞIMA">TAŞIMA</button>
      <button class="selector-btn" data-v="BEKLEME">BEKLEME</button>
      <button class="selector-btn" data-v="HAZIRLIK">HAZIRLIK</button>
    </div>

    <div class="section-label">2. İşlem Adı Seç</div>
    <div class="tile-grid" id="jobGrid"></div>

    <div class="section-label">3. İstasyon / Hat Seç</div>
    <div class="tile-grid" id="stationGrid"></div>

    <div class="section-label">4. Kişi Sayısı</div>
    <div class="selector-row" id="workerCountSelector">
      <button class="selector-btn" data-c="1">1</button>
      <button class="selector-btn active" data-c="2">2</button>
      <button class="selector-btn" data-c="3">3</button>
      <button class="selector-btn" data-c="4">4</button>
      <button class="selector-btn" data-c="5">5</button>
      <input type="number" id="customWCount" class="custom-input" placeholder="Diğer" min="1" max="50" />
    </div>

    <button class="btn-start" id="btnConfirmStart" disabled>İŞLEMİ BAŞLAT</button>
  </section>

  <!-- 4. İŞLEM BİTİRME EKRANI -->
  <section id="screenEnd" hidden>
    <button class="btn-ghost" id="btnCancelEnd" style="margin-bottom:15px;">&larr; Vazgeç</button>
    <div class="active-card">
      <div class="active-title" id="endTitleDisplay"></div>
      <div class="timer" id="endTimerDisplay">00:00:00</div>
    </div>
    <div class="section-label">Duruş / Gecikme Nedeni (Varsa)</div>
    <textarea id="endStopReasonInput" placeholder="Örn: Vinç arızası / Malzeme bekleme (Yoksa boş bırakın)"></textarea>
    <button class="btn-danger" id="btnConfirmEnd" style="margin-top:15px;">İŞLEMİ BİTİR</button>
  </section>

</main>

<!-- 5. DÜZENLEME MODALI -->
<div id="editModal" class="modal-overlay" hidden>
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <span style="font-weight:bold; color:var(--orange);" id="editModalTitle">İşlemi Düzenle</span>
      <button class="btn-action" id="btnCloseEditModal">&times;</button>
    </div>
    <div class="section-label">Kişi Sayısı</div>
    <input type="number" id="editWorkerCountInput" style="width:100%; padding:10px; background:#282a2d; border:1px solid #444; border-radius:6px; color:#fff; margin-bottom:12px;" min="1" max="50" />
    <div class="section-label">Duruş / Gecikme Nedeni</div>
    <textarea id="editStopReasonInput" style="margin-bottom:15px;"></textarea>
    <div style="display:flex; gap:10px;">
      <button class="btn-ghost" id="btnCancelEdit" style="flex:1;">İptal</button>
      <button class="btn-start" id="btnSaveEdit" style="flex:1; padding:10px; margin:0; font-size:14px;">Kaydet</button>
    </div>
  </div>
</div>

<script>
const STORE_KEYS = {
  workers: "kb_final_workers",
  jobs: "kb_final_jobs",
  stations: "kb_final_stations",
  logs: "kb_final_logs"
};

function getStorage(key, def) {
  try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : def; } catch(e) { return def; }
}
function setStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

// Süreyi dakika cinsinden hesaplar (1 dakikadan azsa en az 1 dk kabul eder, sıfır yapmaz)
function calcDurationMin(startIso, endIso) {
  const diffMs = new Date(endIso) - new Date(startIso);
  const rawMin = Math.round(diffMs / 60000);
  return Math.max(1, rawMin); // Asla 0 dk olmaz!
}

let appState = {
  currentWorker: null,
  workers: [],
  jobs: ["Halat kesimi", "Kalıp temizliği", "Yağlama", "Demir atma", "Halat bağlama", "Cıvata ve tayrot sıkılması", "Beton dökme", "Vinç ile taşıma", "Söküm"],
  stations: ["Hat 1", "Hat 2", "Köprü Hattı", "Kalıp Sahası"],
  logs: [],
  activeJob: null,
  endingJob: null,
  editingJobId: null,
  selActivity: "İŞLEM",
  selJob: null,
  selStation: null,
  selCount: 2
};

const el = (id) => document.getElementById(id);
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"}) : "--:--";
const fmtDuration = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(v => String(v).padStart(2, "0")).join(":");
};

function showScreen(screenId) {
  ["screenWorkers", "screenDashboard", "screenStart", "screenEnd"].forEach(id => {
    el(id).hidden = (id !== screenId);
  });
}

function renderWorkers() {
  const grid = el("workerGrid");
  grid.innerHTML = "";
  appState.workers.forEach(w => {
    const tile = document.createElement("div");
    tile.className = "worker-tile";
    tile.innerHTML = `
      <div class="worker-avatar">${w.name.slice(0, 2).toUpperCase()}</div>
      <div class="worker-name">${w.name}</div>
      <div class="worker-id">Sicil: ${w.id}</div>
    `;
    tile.onclick = () => selectWorker(w);
    grid.appendChild(tile);
  });

  const addTile = document.createElement("div");
  addTile.className = "add-btn-tile";
  addTile.textContent = "+ Sorumlu Ekle";
  addTile.onclick = () => { el("addWorkerCard").hidden = false; };
  grid.appendChild(addTile);
}

function selectWorker(w) {
  appState.currentWorker = w;
  el("displayWorkerName").textContent = w.name;
  el("displayWorkerId").textContent = w.id;
  el("workerBar").hidden = false;
  showScreen("screenDashboard");
  refreshDashboard();
}

el("logoutBtn").onclick = () => {
  appState.currentWorker = null;
  el("workerBar").hidden = true;
  showScreen("screenWorkers");
};

el("btnSaveWorker").onclick = () => {
  const id = el("newWId").value.trim();
  const name = el("newWName").value.trim();
  if (!id || !name) return;
  appState.workers.push({ id, name });
  setStorage(STORE_KEYS.workers, appState.workers);
  el("newWId").value = ""; el("newWName").value = "";
  el("addWorkerCard").hidden = true;
  renderWorkers();
};

function refreshDashboard() {
  if (!appState.currentWorker) return;
  const wid = appState.currentWorker.id;

  const activeBox = el("activeBox");
  activeBox.innerHTML = "";
  if (appState.activeJob && appState.activeJob.worker_id === wid) {
    const card = document.createElement("div");
    card.className = "active-card";
    card.innerHTML = `
      <div class="active-tag">${appState.activeJob.activity} &middot; ${appState.activeJob.worker_count} Kişi</div>
      <div class="active-title">${appState.activeJob.job_type} (${appState.activeJob.station})</div>
      <div class="timer" id="liveTimer">00:00:00</div>
      <button class="btn-danger" id="btnFinishJob">İŞLEMİ BİTİR</button>
    `;
    card.querySelector("#btnFinishJob").onclick = () => {
      appState.endingJob = appState.activeJob;
      el("endTitleDisplay").textContent = `[${appState.endingJob.activity}] ${appState.endingJob.job_type}`;
      el("endStopReasonInput").value = "";
      showScreen("screenEnd");
    };
    activeBox.appendChild(card);
  }

  // YALNIZCA BU KİŞİNİN BİTMİŞ İŞLERİ
  const myDoneLogs = appState.logs.filter(l => l.worker_id === wid && l.status === "done").reverse();
  const histContainer = el("historyContainer");
  const histList = el("historyList");

  if (myDoneLogs.length > 0) {
    histContainer.hidden = false;
    histList.innerHTML = "";
    myDoneLogs.forEach(log => {
      const dur = calcDurationMin(log.start_time, log.end_time);
      const adamSaat = ((dur * log.worker_count) / 60).toFixed(2);
      
      const row = document.createElement("div");
      row.className = "history-row";
      row.innerHTML = `
        <div>
          <div class="history-title">[${log.activity}] ${log.job_type}</div>
          <div class="history-sub">${log.station} &middot; ${log.worker_count} Kişi &middot; ${dur} dk &middot; ${adamSaat} Adam-Saat ${log.stop_reason ? `<span style="color:#f39c12;">&middot; Duruş: ${log.stop_reason}</span>` : ""}</div>
        </div>
        <div class="history-right">
          <div style="text-align:right; margin-right:4px;">
            <div style="font-family:monospace; font-size:12px; color:#fff;">${fmtTime(log.start_time)}&ndash;${fmtTime(log.end_time)}</div>
            <div style="font-size:11px; color:#2ecc71;">Tamamlandı</div>
          </div>
          <button class="btn-action btn-edit" title="Düzenle">✏️</button>
          <button class="btn-action btn-del del" title="Sil">🗑️</button>
        </div>
      `;

      row.querySelector(".btn-edit").onclick = () => {
        appState.editingJobId = log.id;
        el("editModalTitle").textContent = `Düzenle: ${log.job_type}`;
        el("editWorkerCountInput").value = log.worker_count;
        el("editStopReasonInput").value = log.stop_reason || "";
        el("editModal").hidden = false;
      };

      row.querySelector(".btn-del").onclick = () => {
        if (confirm(`"${log.job_type}" kaydını silmek istediğinize emin misiniz?`)) {
          appState.logs = appState.logs.filter(l => l.id !== log.id);
          setStorage(STORE_KEYS.logs, appState.logs);
          refreshDashboard();
        }
      };

      histList.appendChild(row);
    });
  } else {
    histContainer.hidden = true;
  }
}

function closeEditModal() {
  appState.editingJobId = null;
  el("editModal").hidden = true;
}
el("btnCloseEditModal").onclick = closeEditModal;
el("btnCancelEdit").onclick = closeEditModal;

el("btnSaveEdit").onclick = () => {
  if (!appState.editingJobId) return;
  const target = appState.logs.find(l => l.id === appState.editingJobId);
  if (target) {
    target.worker_count = parseInt(el("editWorkerCountInput").value) || 1;
    target.stop_reason = el("editStopReasonInput").value.trim();
    setStorage(STORE_KEYS.logs, appState.logs);
  }
  closeEditModal();
  refreshDashboard();
};

el("btnOpenStartScreen").onclick = () => {
  appState.selJob = null;
  appState.selStation = null;
  renderStartGrid();
  showScreen("screenStart");
};
el("btnCancelStart").onclick = () => showScreen("screenDashboard");
el("btnCancelEnd").onclick = () => showScreen("screenDashboard");

function renderStartGrid() {
  const jg = el("jobGrid"); jg.innerHTML = "";
  appState.jobs.forEach(j => {
    const t = document.createElement("div");
    t.className = "tile" + (appState.selJob === j ? " active-orange" : "");
    t.textContent = j;
    t.onclick = () => { appState.selJob = j; renderStartGrid(); };
    jg.appendChild(t);
  });
  const addJ = document.createElement("div");
  addJ.className = "add-btn-tile"; addJ.textContent = "+ İşlem Ekle";
  addJ.onclick = () => {
    const n = prompt("Yeni İşlem Adı:");
    if (n && n.trim()) { appState.jobs.push(n.trim()); setStorage(STORE_KEYS.jobs, appState.jobs); renderStartGrid(); }
  };
  jg.appendChild(addJ);

  const sg = el("stationGrid"); sg.innerHTML = "";
  appState.stations.forEach(s => {
    const t = document.createElement("div");
    t.className = "tile" + (appState.selStation === s ? " active-yellow" : "");
    t.textContent = s;
    t.onclick = () => { appState.selStation = s; renderStartGrid(); };
    sg.appendChild(t);
  });
  const addS = document.createElement("div");
  addS.className = "add-btn-tile"; addS.textContent = "+ Hat Ekle";
  addS.onclick = () => {
    const n = prompt("Yeni Hat / İstasyon Adı:");
    if (n && n.trim()) { appState.stations.push(n.trim()); setStorage(STORE_KEYS.stations, appState.stations); renderStartGrid(); }
  };
  sg.appendChild(addS);

  el("btnConfirmStart").disabled = !(appState.selJob && appState.selStation);
}

document.querySelectorAll("#activitySelector .selector-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#activitySelector .selector-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    appState.selActivity = b.getAttribute("data-v");
  };
});

document.querySelectorAll("#workerCountSelector .selector-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#workerCountSelector .selector-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    appState.selCount = parseInt(b.getAttribute("data-c"));
    el("customWCount").value = "";
  };
});
el("customWCount").oninput = (e) => {
  const v = parseInt(e.target.value);
  if (v && v > 0) {
    document.querySelectorAll("#workerCountSelector .selector-btn").forEach(x => x.classList.remove("active"));
    appState.selCount = v;
  }
};

el("btnConfirmStart").onclick = () => {
  appState.activeJob = {
    id: "job-" + Date.now(),
    worker_id: appState.currentWorker.id,
    job_type: appState.selJob,
    activity: appState.selActivity,
    station: appState.selStation,
    worker_count: appState.selCount,
    start_time: new Date().toISOString()
  };
  showScreen("screenDashboard");
  refreshDashboard();
};

el("btnConfirmEnd").onclick = () => {
  if (!appState.endingJob) return;
  const finished = {
    ...appState.endingJob,
    end_time: new Date().toISOString(),
    stop_reason: el("endStopReasonInput").value.trim(),
    status: "done"
  };
  appState.logs.push(finished);
  setStorage(STORE_KEYS.logs, appState.logs);
  appState.activeJob = null;
  appState.endingJob = null;
  showScreen("screenDashboard");
  refreshDashboard();
};

// EXCEL ÇIKTISI (TAM İZOLASYON, 0. DAKİKA VE SIFIR OLMAYAN SÜRELER)
el("btnExportExcel").onclick = () => {
  if (!appState.currentWorker) return;
  const wid = appState.currentWorker.id;

  const myLogs = appState.logs
    .filter(l => l.worker_id === wid && l.status === "done")
    .sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

  if (myLogs.length === 0) {
    alert(`${appState.currentWorker.name} adına tamamlanmış bir işlem bulunmuyor.`);
    return;
  }

  const baseTime = new Date(myLogs[0].start_time).getTime();

  const wsData = [
    ["KÖPRÜ KİRİŞİ ETÜDÜ - ZAMAN ETÜDÜ FORMU"],
    ["Tarih:", new Date().toLocaleDateString("tr-TR"), "", "Tesis / Firma:", "KAMBETON A.Ş."],
    ["Gözlemci:", `${appState.currentWorker.name} (Sicil: ${appState.currentWorker.id})`, "", "Vardiya:", "07:45 - 17:45"],
    [],
    ["İŞLEM NO", "İŞLEM ADI", "FAALİYET", "BAŞLANGIÇ SAATİ", "BAŞLAMA", "BİTİŞ SAATİ", "BİTİŞ", "SÜRE (dk)", "KİŞİ", "ADAM SAAT", "DURUŞ / GECİKME NEDENİ"]
  ];

  let sumIslem = 0, sumTasima = 0, sumBekleme = 0, sumHazirlik = 0, sumAdamSaat = 0;

  myLogs.forEach((l, idx) => {
    const sMs = new Date(l.start_time).getTime();
    const eMs = new Date(l.end_time).getTime();
    const baslama = Math.max(0, Math.round((sMs - baseTime) / 60000));
    const bitis = Math.max(baslama + 1, Math.round((eMs - baseTime) / 60000));
    const sure = calcDurationMin(l.start_time, l.end_time); // En az 1 dk
    const adamSaat = Number(((sure * l.worker_count) / 60).toFixed(2));

    if (l.activity === "İŞLEM") sumIslem += sure;
    else if (l.activity === "TAŞIMA") sumTasima += sure;
    else if (l.activity === "BEKLEME") sumBekleme += sure;
    else if (l.activity === "HAZIRLIK") sumHazirlik += sure;
    sumAdamSaat += adamSaat;

    wsData.push([
      idx + 1, l.job_type, l.activity, fmtTime(l.start_time), baslama, fmtTime(l.end_time), bitis, sure, l.worker_count, adamSaat, l.stop_reason || "-"
    ]);
  });

  const totalFaaliyet = sumIslem + sumTasima + sumBekleme + sumHazirlik;

  wsData.push([]);
  wsData.push([]);
  wsData.push(["FAALİYET", "SÜRE (DK)", "", "ÖZET TABLOSU", "DEĞER"]);
  wsData.push(["İŞLEM", sumIslem, "", "TOPLAM İŞLEM SÜRESİ", sumIslem]);
  wsData.push(["TAŞIMA", sumTasima, "", "TOPLAM TAŞIMA SÜRESİ", sumTasima]);
  wsData.push(["BEKLEME", sumBekleme, "", "TOPLAM BEKLEME SÜRESİ", sumBekleme]);
  wsData.push(["HAZIRLIK", sumHazirlik, "", "TOPLAM HAZIRLIK SÜRESİ", sumHazirlik]);
  wsData.push(["", "", "", "TOPLAM ADAM SAAT SÜR.", Number(sumAdamSaat.toFixed(2))]);
  wsData.push(["", "", "", "TOPLAM FAALİYET SÜRESİ", totalFaaliyet]);

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws["!cols"] = [
    { wch: 10 }, { wch: 32 }, { wch: 14 }, { wch: 16 }, { wch: 10 },
    { wch: 14 }, { wch: 10 }, { wch: 12 }, { wch: 8 }, { wch: 14 }, { wch: 25 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Zaman_Etudu");

  const cleanName = appState.currentWorker.name.replace(/\s+/g, "_");
  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `etut_${cleanName}_${dateStr}.xlsx`);
};

el("btnClearMyEtud").onclick = () => {
  if (confirm(`DİKKAT: ${appState.currentWorker.name} adına tutulan mevcut etüt sıfırlanacak. Yeni etüt 0. dakikadan başlayacak.\n\nOnaylıyor musunuz?`)) {
    appState.logs = appState.logs.filter(l => l.worker_id !== appState.currentWorker.id);
    setStorage(STORE_KEYS.logs, appState.logs);
    refreshDashboard();
  }
};

setInterval(() => {
  const now = new Date();
  el("clock").textContent = now.toLocaleTimeString("tr-TR");
  if (appState.activeJob) {
    const td = document.getElementById("liveTimer");
    if (td) td.textContent = fmtDuration(now - new Date(appState.activeJob.start_time));
  }
  if (appState.endingJob) {
    const et = document.getElementById("endTimerDisplay");
    if (et) et.textContent = fmtDuration(now - new Date(appState.endingJob.start_time));
  }
}, 1000);

function init() {
  appState.workers = getStorage(STORE_KEYS.workers, []);
  appState.jobs = getStorage(STORE_KEYS.jobs, appState.jobs);
  appState.stations = getStorage(STORE_KEYS.stations, appState.stations);
  appState.logs = getStorage(STORE_KEYS.logs, []);
  renderWorkers();
  showScreen("screenWorkers");
}
init();
</script>
</body>
